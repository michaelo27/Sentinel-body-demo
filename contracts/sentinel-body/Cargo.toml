[package]
name = "sentinel-body"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NEP-171/177/181/297 Sentinel Body NFT + agent registry + on-chain snapshot commitments."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
near-workspaces = { version = "=0.24.0", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
